<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reBot · End-effector control</title>
  <link rel="stylesheet" href="/viewer.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
  <main id="viewport" aria-label="Robot 3D viewport">
    <header class="topbar">
      <div class="identity">
        <h1>reBot <span id="environment">Simulation</span></h1>
        <p id="control-status" role="status">Loading model…</p>
      </div>
      <nav aria-label="Viewer actions">
        <button id="fit" title="Reset camera (F)">Reset view</button>
        <button id="stop" class="stop" disabled>Stop &amp; hold</button>
      </nav>
    </header>
    <div id="notice" role="status" hidden></div>
    <section id="pose-panel" class="surface" aria-labelledby="pose-title" hidden>
      <div class="panel-heading"><h2 id="pose-title">Set pose</h2><button id="close-pose" class="close" aria-label="Close pose editor">×</button></div>
      <form id="pose-form">
        <fieldset><legend>Position <span>mm · base frame</span></legend>
          <div class="vector"><label>X<input id="px" aria-label="Target X (mm)" type="number" step="any" required></label><label>Y<input id="py" aria-label="Target Y (mm)" type="number" step="any" required></label><label>Z<input id="pz" aria-label="Target Z (mm)" type="number" step="any" required></label></div>
        </fieldset>
        <fieldset><legend>Orientation <span>degrees · fixed XYZ</span></legend>
          <div class="vector"><label>Roll<input id="rx" aria-label="Target roll (deg)" type="number" step="any" required></label><label>Pitch<input id="ry" aria-label="Target pitch (deg)" type="number" step="any" required></label><label>Yaw<input id="rz" aria-label="Target yaw (deg)" type="number" step="any" required></label></div>
        </fieldset>
        <p id="pose-error" class="detail"></p>
        <button id="apply-pose" class="primary full" type="submit" disabled>Apply pose</button>
      </form>
    </section>
    <footer>
      <div id="control-bar" class="surface" aria-label="End-effector tools" hidden>
        <div id="active-tools">
          <div class="segmented" role="group" aria-label="Transform tool"><button id="translate" aria-pressed="true" title="Move (T)">Move</button><button id="rotate" aria-pressed="false" title="Rotate (R)">Rotate</button></div>
          <button id="edit-pose" aria-expanded="false" aria-controls="pose-panel">Set pose</button>
          <span class="separator" aria-hidden="true"></span>
          <button id="hold">Hold</button>
        </div>
      </div>
      <p id="hint">Drag to orbit · Scroll to zoom</p>
    </footer>
  </main>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
