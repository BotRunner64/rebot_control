<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Camera viewer</title>
  <link rel="stylesheet" href="/viewer.css">
  <script src="/viewer.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="/" aria-label="Camera viewer home">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="6" width="18" height="14" rx="4" stroke="currentColor" stroke-width="1.7"/>
        <path d="m8 6 1.4-2h5.2L16 6" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <span>Camera viewer</span>
    </a>
    <div class="toolbar-actions">
      <p id="summary" class="summary" role="status">Connecting to cameras...</p>
      <button id="close-viewer" class="button" type="button" title="Close viewer (Q or Esc)">Close viewer</button>
    </div>
  </header>
  <main>
    <p id="notice" class="notice" role="status" hidden></p>
    <section id="cameras" class="camera-grid" aria-label="Camera previews"></section>
  </main>
  <template id="camera-template">
    <article class="camera-card">
      <header class="camera-heading">
        <div class="camera-identity">
          <h2></h2>
          <p class="source"></p>
        </div>
        <span class="status" data-state="waiting"><span class="status-dot"></span><span class="status-text">Waiting</span></span>
      </header>
      <div class="viewport">
        <img alt="" class="camera-image">
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="6" width="18" height="14" rx="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="m8 6 1.4-2h5.2L16 6" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <p class="placeholder-title">Waiting for camera</p>
          <p class="placeholder-detail" hidden></p>
        </div>
      </div>
      <footer class="camera-footer">
        <span class="capture-mode"></span>
        <button class="expand button button-quiet" type="button" aria-pressed="false">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Expand view</span>
        </button>
      </footer>
    </article>
  </template>
</body>
</html>
