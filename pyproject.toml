[project]
name = "rebot-control"
version = "0.2.0"
description = "Control, teleoperation, and data collection for reBot Arm RS with Star Arm leaders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fashionstar-uart-sdk>=1.3.12",
    "python-can>=4.4",
    "pyserial>=3.5",
    "numpy>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "mujoco>=3.3",
    "pin>=3.9.0",
    "websockets>=14,<17",
    "pyarrow>=17",
    "opencv-python-headless>=4.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ee = ["mink>=1.4.0,<2", "quadprog>=0.1.13"]
policy = ["msgpack>=1.0"]
data = ["loom-data @ git+https://github.com/BotRunner64/LOOM-data.git@feba93d4df58c3fbbd2ba51a55617c3459c07ade"]

[project.scripts]
rebot = "rebot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rebot*"]
