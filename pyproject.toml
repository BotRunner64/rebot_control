[project]
name = "rebot-control"
version = "0.2.0"
description = "Control, teleoperation, and data collection for reBot Arm RS with Star Arm leaders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fashionstar-uart-sdk>=1.3.12",
    "python-can>=4.4",
    "pyserial>=3.5",
    "numpy>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "mujoco>=3.3",
    "pin>=3.9.0",
    "websockets>=14,<17",
    "pyarrow>=17",
    "opencv-python-headless>=4.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ee = ["mink>=1.4.0,<2", "quadprog>=0.1.13"]
policy = ["msgpack>=1.0"]
# Dataset export only. Install LeRobot itself afterwards with --no-deps; see docs/data.md.
lerobot = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "datasets>=4,<5",
    "av>=15,<16",
    "huggingface-hub>=0.34.2,<0.36",
    "accelerate>=1.10,<2",
    "einops>=0.8,<0.9",
    "draccus==0.10.0",
    "imageio[ffmpeg]>=2.34,<3",
    "tqdm>=4.66",
]

[project.scripts]
rebot = "rebot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rebot*"]
