[project]
name = "rebot-control"
version = "0.1.0"
description = "Control and teleoperation for reBot Arm RS with Star Arm leaders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fashionstar-uart-sdk>=1.3.12",
    "robstride-dynamics>=0.0.1",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "Pillow>=10.0",
    "mujoco>=3.3",
    "pin>=3.9.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
