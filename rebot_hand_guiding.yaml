# Experimental, unloaded, upright B601-RS defaults. These are not tuned for this robot.
rate_hz: 50
max_sample_gap_s: 0.10
max_feedback_age_s: 0.08
# Legacy compatibility setting; temperature is recorded without host-side shutdown.
max_temperature_c: 65
# Retain initial pose and full gravity support before allowing drag release.
startup_duration_s: 2.0
hold_ramp_s: 0.3
velocity_filter_s: 0.04
still_speed_rad_s: 0.03
release_speed_rad_s: 0.12
release_error_rad: 0.035
settle_duration_s: 0.5
hold_kp: [6, 15, 12, 4, 3, 2]
damping: [0.5, 1.5, 1.2, 0.4, 0.3, 0.2]
torque_limit_nm: [3, 15, 10, 3, 2, 1]
gravity_scale: [1, 0.98, 0.98, 1, 1, 1]
