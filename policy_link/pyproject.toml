[project]
name = "rebot-policy-link"
version = "0.1.0"
description = "Policy-agnostic observation/action link for reBot controllers and policy servers"
requires-python = ">=3.10"
dependencies = ["msgpack>=1.0", "websockets>=14,<17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rebot_policy_link"]
